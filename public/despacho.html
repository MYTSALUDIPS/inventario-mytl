<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Módulo de Despacho</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    body { background:#0b1b2b; color:white; }
    .card { background:#142c44; border:1px solid #0ff3; border-radius:10px; }
    table { background:#1d3858; color:white; }
    th { background:#0b1b2b; color:#00b4ff; }
    .badge-pendiente { background:#ffc107; color:#000; }
    .badge-despachado { background:#28a745; }
    .filtros input, .filtros select {
      background:#0b1b2b; color:white; border:1px solid #00b4ff;
    }
  </style>
</head>

<body class="p-4">

  <!-- NAV -->
  <nav class="navbar navbar-dark mb-4" style="background-color:#0b1b2b;">
    <div class="container-fluid d-flex justify-content-between">
      <button class="btn btn-outline-info btn-sm" onclick="ir('menu.html')">🏠 Menú</button>
      <div>
        <span id="usuarioActivo" class="text-info me-3"></span>
        <button class="btn btn-danger btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <!-- CARD PRINCIPAL -->
  <div class="card p-3">

    <!-- TITULO + BOTONES -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="text-info m-0">🚚 MÓDULO DE DESPACHO</h4>

      <div class="d-flex gap-2">
        <button class="btn btn-warning btn-sm" onclick="exportarMes()">📄 Exportar PDF Mensual</button>
        <button id="btnEliminarTodo" class="btn btn-danger btn-sm">🗑️ Eliminar TODO el despacho</button>
      </div>
    </div>

    <!-- 🔍 FILTROS -->
    <div class="card p-3 filtros mb-3">
      <div class="row g-2">
        <div class="col-md-3">
          <input id="fUsuario" class="form-control" placeholder="Filtrar por usuario...">
        </div>
        <div class="col-md-3">
          <input id="fProducto" class="form-control" placeholder="Filtrar por producto...">
        </div>
        <div class="col-md-2">
          <select id="fEstado" class="form-select">
            <option value="">-- Estado --</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="DESPACHADO">Despachado</option>
          </select>
        </div>
        <div class="col-md-2">
          <input id="fFecha" type="date" class="form-control">
        </div>
        <div class="col-md-2">
          <button class="btn btn-info w-100" onclick="aplicarFiltros()">🔎 Filtrar</button>
        </div>
      </div>
    </div>

    <!-- TABLA -->
    <table class="table table-sm table-bordered mt-2">
      <thead>
        <tr>
          <th>#</th>
          <th>Usuario</th>
          <th>Producto</th>
          <th>Presentación</th>
          <th>Cant. Solicitada</th>
          <th>Cant. Entregada</th>
          <th>Municipio</th>
          <th>Sede</th>
          <th>Área</th>
          <th>Fecha Pedido</th>
          <th>Estado</th>
          <th>Fecha Entrega</th>
          <th>PDF</th>
          <th>Observación</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tbodyDespacho"></tbody>
    </table>
  </div>

<script>
const API_DESPACHO = "/api/despacho";
const usuario = JSON.parse(localStorage.getItem("usuario")) || {};

if (!usuario || !usuario.correo) window.location.href = "login.html";

document.getElementById("usuarioActivo").textContent =
  `${usuario.nombre} (${usuario.correo} - ${usuario.rol})`;

if (usuario.rol !== "admin") document.getElementById("btnEliminarTodo").style.display = "none";

let DATA = []; // memoria temporal de despachos

// ===========================================
// 🔥 CARGAR DESPACHOS
// ===========================================
async function cargarDespachos() {
  const r = await fetch(API_DESPACHO);
  DATA = await r.json();
  renderTabla(DATA);
}

function renderTabla(arr) {
  const tbody = document.getElementById("tbodyDespacho");

  tbody.innerHTML = arr.map((x,i) => {
    const fechaPedido = x.fecha_registro ? new Date(x.fecha_registro).toLocaleDateString() : "";
    const fechaEntrega = x.fecha_despacho ? new Date(x.fecha_despacho).toLocaleDateString() : "-";
    const estado = x.estado || "PENDIENTE";

    const badge = estado === "DESPACHADO"
      ? `<span class="badge badge-despachado">DESPACHADO</span>`
      : `<span class="badge badge-pendiente">PENDIENTE</span>`;

    const pdfBtn = x.pdf_ruta
      ? `<a href="${x.pdf_ruta}" target="_blank" class="btn btn-sm btn-outline-info mb-1">📄 Ver</a>`
      : `<small class="text-warning">Sin PDF</small>`;

    return `
      <tr data-id="${x.id}">
        <td>${i+1}</td>
        <td>${x.usuario}</td>
        <td>${x.producto}</td>
        <td>${x.presentacion}</td>
        <td>${x.cantidad}</td>

        <td><input class="form-control form-control-sm inp-cant" type="number" min="0" value="${x.cantidad_entregada || x.cantidad}"></td>

        <td>${x.municipio}</td>
        <td>${x.sede}</td>
        <td>${x.area}</td>
        <td>${fechaPedido}</td>

        <td>${badge}</td>
        <td>${fechaEntrega}</td>

        <td>
          ${pdfBtn}
          <input type="file" class="form-control form-control-sm mt-1 inp-pdf" accept="application/pdf">
        </td>

        <td>
          <input class="form-control form-control-sm inp-obs"
                 value="${x.observacion || x.obs_despacho || ""}">
        </td>

        <td><button class="btn btn-success btn-sm btn-despachar">🚚 Despachar</button></td>
      </tr>
    `;
  }).join("");

  document.querySelectorAll(".btn-despachar").forEach(b => {
    b.onclick = () => despacharFila(b.closest("tr"));
  });
}

cargarDespachos();


// ===========================================
// 🔥 DESPACHAR UNA FILA
// ===========================================
async function despacharFila(tr) {
  const id = tr.getAttribute("data-id");
  const cant = tr.querySelector(".inp-cant").value;
  const obs = tr.querySelector(".inp-obs").value;
  const pdf = tr.querySelector(".inp-pdf").files[0];

  const fd = new FormData();
  fd.append("cantidad_entregada", cant);
  fd.append("observacion", obs);
  fd.append("usuario_despachador", usuario.correo);

  if (pdf) fd.append("pdf", pdf);

  const r = await fetch(`${API_DESPACHO}/${id}/despachar`, { method:"POST", body:fd });
  const j = await r.json();

  alert(j.message);
  cargarDespachos();
}


// ===========================================
// 🔍 FILTROS AVANZADOS
// ===========================================
function aplicarFiltros() {
  const u = document.getElementById("fUsuario").value.toLowerCase();
  const p = document.getElementById("fProducto").value.toLowerCase();
  const e = document.getElementById("fEstado").value;
  const f = document.getElementById("fFecha").value;

  const filtrado = DATA.filter(x => {
    return (
      (!u || x.usuario.toLowerCase().includes(u)) &&
      (!p || x.producto.toLowerCase().includes(p)) &&
      (!e || x.estado === e) &&
      (!f || x.fecha_despacho?.slice(0,10) === f)
    );
  });

  renderTabla(filtrado);
}


// ===========================================
// 📄 EXPORTAR PDF MENSUAL
// ===========================================
function exportarMes() {
  const mes = prompt("Mes (1-12):");
  const anio = prompt("Año:");

  if (!mes || !anio) return;

  window.open(`/api/despacho/export/mes/${anio}/${mes}`, "_blank");
}


// ===========================================
// 🗑 ELIMINAR TODO
// ===========================================
document.getElementById("btnEliminarTodo").onclick = async () => {
  if (!confirm("¿Eliminar TODO el despacho?")) return;

  const r = await fetch(API_DESPACHO, { method:"DELETE" });
  const j = await r.json();
  alert(j.message);

  cargarDespachos();
};


// ===========================================
function ir(p){ location.href = p; }
function cerrarSesion(){ localStorage.clear(); location.href="login.html"; }
// ===========================================

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👥 GESTIÓN DE USUARIOS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #0b1724; color: #00b4ff; font-size: 14px; }
    table { color: white; font-size: 13px; }
    th, td { text-align: center; vertical-align: middle; }
    .btn-guardar { background-color: #00b4ff; color: white; border: none; }
    .btn-editar { background-color: #f0ad4e; color: white; border: none; }
    .btn-eliminar { background-color: #dc3545; color: white; border: none; }
    .input-dark { background:#08111c; color:white; border:1px solid #00b4ff; border-radius:6px; padding:5px; }
  </style>
</head>
<body class="p-4">

  <!-- 🔒 Cabecera con sesión -->
  <div style="position: fixed; top: 10px; right: 20px; z-index: 1000; display:flex; align-items:center; gap:10px;">
    <span id="userLabel" style="color:#00b4ff; font-weight:bold; font-size:14px;"></span>
    <button id="logoutBtn" class="btn btn-danger btn-sm">🚪 Cerrar sesión</button>
  </div>

  <!-- 🔹 Botón para volver al menú -->
  <div class="d-flex justify-content-start mb-3" style="margin-top: 40px;">
    <button class="btn btn-sm btn-outline-info" onclick="window.location.href='menu.html'">
      🏠 Menú
    </button>
  </div>

  <h3 class="text-center mb-4 text-info">
    <img src="https://cdn-icons-png.flaticon.com/512/1946/1946429.png" width="30" alt="">
    GESTIÓN DE USUARIOS
  </h3>


  <!-- 🧾 Formulario de usuario -->
  <div class="container mb-3">
    <div class="row g-2">
      <div class="col-md-3"><input id="nombre" class="form-control input-dark" placeholder="Nombre completo"></div>
      <div class="col-md-3"><input id="correo" type="email" class="form-control input-dark" placeholder="Correo electrónico"></div>
      <div class="col-md-3"><input id="password" type="password" class="form-control input-dark" placeholder="Contraseña"></div>
      <div class="col-md-2">
        <select id="rol" class="form-select input-dark">
          <option value="user">Usuario</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <div class="col-md-1">
        <button id="guardarBtn" class="btn btn-guardar w-100">💾 Guardar</button>
      </div>
    </div>
  </div>

  <!-- 📋 Tabla -->
  <div class="table-responsive">
    <table id="tablaUsuarios" class="table table-bordered table-sm align-middle">
      <thead class="table-primary text-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
const API = "http://localhost:4000/api/usuarios";

/* 🔒 Verificación de sesión + rol admin */
const usuario = JSON.parse(localStorage.getItem("usuario"));
if (!usuario) {
  window.location.href = "login.html";
} else if (usuario.rol !== "admin") {
  alert("Acceso restringido: solo administradores.");
  window.location.href = "kardex.html";
} else {
  document.getElementById("userLabel").textContent = `${usuario.nombre} (${usuario.rol})`;
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  if (confirm("¿Deseas cerrar sesión?")) {
    localStorage.removeItem("usuario");
    window.location.href = "login.html";
  }
});

/* 📥 Cargar usuarios */
async function cargarUsuarios() {
  const res = await fetch(`${API}/listar`, { headers: { "x-role": usuario.rol }});
  const json = await res.json();
  if (!res.ok) { alert(json.message || "Error al listar usuarios"); return; }
  const data = json.data || [];
  const tbody = document.querySelector("#tablaUsuarios tbody");
  tbody.innerHTML = "";
  data.forEach(u => {
    tbody.innerHTML += `
      <tr>
        <td>${u.id}</td>
        <td>${u.nombre}</td>
        <td>${u.correo}</td>
        <td>${u.rol}</td>
        <td>
          <button class="btn btn-editar btn-sm" onclick="editarUsuario(${u.id}, '${u.nombre}', '${u.correo}', '${u.rol}')">✏️</button>
          <button class="btn btn-eliminar btn-sm" onclick="eliminarUsuario(${u.id})">🗑</button>
        </td>
      </tr>`;
  });
}

/* 💾 Guardar o actualizar usuario */
async function guardarUsuario() {
  const id = document.getElementById("guardarBtn").dataset.id || null;
  const data = {
    nombre: document.getElementById("nombre").value.trim(),
    correo: document.getElementById("correo").value.trim(),
    password: document.getElementById("password").value,
    rol: document.getElementById("rol").value
  };

  if (!data.nombre || !data.correo || (!id && !data.password))
    return alert("Por favor completa los campos obligatorios.");

  const method = id ? "PUT" : "POST";
  const url = id ? `${API}/editar/${id}` : `${API}/crear`;

  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json", "x-role": usuario.rol },
    body: JSON.stringify(data)
  });
  const msg = await res.json();
  alert(msg.message || "Operación completada.");
  document.getElementById("guardarBtn").dataset.id = "";
  limpiarFormulario();
  cargarUsuarios();
}

/* ✏️ Editar */
function editarUsuario(id, nombre, correo, rol) {
  document.getElementById("nombre").value = nombre;
  document.getElementById("correo").value = correo;
  document.getElementById("rol").value = rol;
  document.getElementById("guardarBtn").dataset.id = id;
  document.getElementById("password").value = "";
}

/* ❌ Eliminar */
async function eliminarUsuario(id) {
  if (!confirm("¿Eliminar usuario?")) return;
  const res = await fetch(`${API}/eliminar/${id}`, { method: "DELETE", headers: { "x-role": usuario.rol }});
  const msg = await res.json();
  alert(msg.message || "Eliminado.");
  cargarUsuarios();
}

/* 🧹 Limpiar */
function limpiarFormulario() {
  document.getElementById("nombre").value = "";
  document.getElementById("correo").value = "";
  document.getElementById("password").value = "";
  document.getElementById("rol").value = "user";
}

document.getElementById("guardarBtn").addEventListener("click", guardarUsuario);
cargarUsuarios();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>📊 SISTEMA DE INVENTARIO - MYT</title>
<style>
  body {
    background: #08111c;
    color: #e0f6ff;
    font-family: Arial, system-ui;
    text-align: center;
    margin-top: 60px;
  }
  h1 {
    color: #00aaff;
    margin-bottom: 30px;
  }
  .card {
    display: inline-block;
    background: #0f1e2e;
    border: 1px solid #00bfff;
    border-radius: 15px;
    padding: 30px;
    margin: 20px;
    width: 260px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 0 10px rgba(0,191,255,0.2);
  }
  .card:hover {
    transform: translateY(-5px);
    background: #102840;
    box-shadow: 0 0 15px rgba(0,191,255,0.4);
  }
  .card h2 {
    color: #34d399;
    margin-bottom: 10px;
  }
  .card p {
    color: #8fbfd4;
    font-size: 13px;
  }
  footer {
    margin-top: 50px;
    color: #8fbfd4;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>📊 SISTEMA DE INVENTARIO MYT 2025</h1>

  <div class="card" onclick="location.href='kardex.html'">
    <h2>📦 Kardex</h2>
    <p>Registro y control de entradas y salidas de productos</p>
  </div>

  <div class="card" onclick="location.href='maestra.html'">
    <h2>📘 Maestra</h2>
    <p>Catálogo de productos e importación desde Excel</p>
  </div>

  <footer>
    <p>© 2025 MYT | Sistema de Inventario desarrollado en Node.js + MariaDB</p>
  </footer>
</body>
</html>

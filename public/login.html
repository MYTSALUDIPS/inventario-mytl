<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Iniciar Sesión - MYT SALUD IPS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* 🌌 Fondo corporativo */
    body {
      background: radial-gradient(circle at center, rgba(0,20,40,0.95), rgba(0,10,25,1)),
                  url("logo_myt.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #00b4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* 📦 Contenedor principal */
    .login-box {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.4);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      text-align: center;
      position: relative;
      opacity: 0;
      transform: scale(0.9);
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: scale(1); }
    }

    /* Logo */
    .login-box img {
      width: 100px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 15px #00d5ff);
      animation: floatLogo 4s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .login-box h3 {
      margin-bottom: 25px;
      color: #00bfff;
      text-shadow: 0 0 10px #00d5ff;
      font-weight: 700;
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid #00b4ff;
      border-radius: 10px;
      padding-left: 40px;
      transition: 0.3s;
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px #00bfff88;
      border-color: #00e0ff;
    }

    .form-label {
      color: #00cfff;
      font-weight: 500;
      text-align: left;
      display: block;
      margin-bottom: 5px;
    }

    /* Botón */
    .btn-login {
      background: linear-gradient(145deg, #00b4ff, #007acc);
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      margin-top: 15px;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0, 180, 255, 0.4);
    }

    .btn-login:hover {
      background: linear-gradient(145deg, #00d5ff, #0094ff);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 220, 255, 0.7);
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 36px;
      cursor: pointer;
      color: #00d5ff;
      transition: 0.3s;
    }

    .toggle-password:hover {
      color: #00ffff;
    }

    .alerta {
      color: #ffc107;
      margin-top: 15px;
      font-size: 14px;
      min-height: 18px;
    }

    #loader {
      display: none;
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00b4ff;
      font-size: 18px;
    }

    footer {
      position: absolute;
      bottom: 20px;
      text-align: center;
      width: 100%;
      color: #00cfff;
      font-size: 0.9rem;
      text-shadow: 0 0 10px #00e0ff88;
    }

    /* 🔄 Transición de salida */
    .fade-out {
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.6s ease;
    }
  </style>
</head>
<body>

  <div class="login-box" id="loginBox">
    <img src="logo_myt.jpg" alt="MYT SALUD IPS">
    <h3>🔒 Iniciar Sesión</h3>

    <div class="mb-3 text-start">
      <label for="correo" class="form-label">Correo electrónico</label>
      <input type="email" id="correo" class="form-control" placeholder="tu.nombre@mytsalud.com">
    </div>

    <div class="mb-3 text-start position-relative">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" id="password" class="form-control" placeholder="********">
      <span id="togglePassword" class="toggle-password">👁️</span>
    </div>

    <button class="btn btn-login" id="loginBtn">Ingresar</button>

    <div id="msg" class="alerta"></div>
    <div id="loader">⏳ Verificando...</div>
  </div>

  <footer>Un valioso respaldo en salud</footer>

  <script>
    const API = "http://localhost:4000/api/usuarios/login";

    // Si ya hay sesión activa
    const usuarioActivo = JSON.parse(localStorage.getItem("usuario"));
    if (usuarioActivo) {
      fadeOutAndRedirect("menu.html");
    }

    // 👁️ Mostrar / ocultar contraseña
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    togglePassword.addEventListener("click", () => {
      const type = passwordInput.type === "password" ? "text" : "password";
      passwordInput.type = type;
      togglePassword.textContent = type === "password" ? "👁️" : "🙈";
    });

    // 🔐 Iniciar sesión
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");
      const loader = document.getElementById("loader");

      if (!correo || !password) {
        msg.textContent = "⚠️ Ingresa tu correo y contraseña.";
        return;
      }

      msg.textContent = "⏳ Verificando...";
      loader.style.display = "block";

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ correo, password })
        });

        const data = await res.json();
        loader.style.display = "none";

        if (!res.ok) {
          msg.textContent = "❌ " + (data.message || "Credenciales incorrectas");
          return;
        }

        // Guardar usuario
        localStorage.setItem("usuario", JSON.stringify(data.usuario));

        msg.textContent = "✅ Bienvenido " + data.usuario.nombre + " (" + data.usuario.rol + ")";
        setTimeout(() => {
          fadeOutAndRedirect("menu.html");
        }, 800);

      } catch (err) {
        loader.style.display = "none";
        msg.textContent = "❌ Error de conexión con el servidor";
        console.error(err);
      }
    });

    // 🔄 Animación de salida antes de redirigir
    function fadeOutAndRedirect(url) {
      const box = document.getElementById("loginBox");
      box.classList.add("fade-out");
      setTimeout(() => { window.location.href = url; }, 600);
    }
  </script>
</body>
</html>
